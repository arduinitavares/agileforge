name: ${AGILEFORGE_CONTAINER_PROJECT:-agileforge}
services:
  development:
    container_name: ${COMPOSE_PROJECT_NAME:-agileforge}-dev
    image: ${AGILEFORGE_DEVELOPMENT_IMAGE:-agileforge-development:local}
    profiles: [development]
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - workspace:/workspace
      - cache:/cache
    ports:
      - "127.0.0.1:8765:8765"
    stop_grace_period: 15s
  production:
    image: ${AGILEFORGE_PRODUCTION_IMAGE:-agileforge-production:local}
    platform: linux/amd64
    volumes:
      - production-state:/var/lib/agileforge
      - workspace:/workspace
    ports:
      - "127.0.0.1:${AGILEFORGE_PORT:-8766}:8765"
    stop_grace_period: 15s
volumes:
  workspace:
    name: ${COMPOSE_PROJECT_NAME:-agileforge}-workspace
  cache:
    name: ${COMPOSE_PROJECT_NAME:-agileforge}-cache
  production-state:
    name: ${COMPOSE_PROJECT_NAME:-agileforge}-production-state
