<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#17202a',
                        paper: '#f7f8fa',
                        accent: '#087f5b',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        };
    </script>
    <style>
        html { overflow-x: hidden; }
        body { min-width: 0; }
        .material-symbols-outlined { font-size: 20px; line-height: 1; }
    </style>
    <title>Projects | AgileForge</title>
</head>

<body class="min-h-screen bg-paper font-sans text-ink">
    <header class="border-b border-slate-300 bg-white">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
            <div class="flex min-w-0 items-center gap-3">
                <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-accent text-white">
                    <span class="material-symbols-outlined" aria-hidden="true">account_tree</span>
                </span>
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase text-accent">AgileForge</p>
                    <h1 class="truncate text-lg font-bold">Projects</h1>
                </div>
            </div>
            <button id="open-create-project" type="button"
                class="inline-flex min-h-10 shrink-0 items-center gap-2 rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2">
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                <span class="hidden sm:inline">New project</span>
                <span class="sm:hidden">New</span>
            </button>
        </div>
    </header>

    <main class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-6 border-b border-slate-300 pb-5">
            <h2 class="text-2xl font-bold">Project workspace</h2>
            <p class="mt-1 max-w-2xl text-sm leading-6 text-slate-600">Open a project to continue its current product and delivery work.</p>
        </div>
        <div id="projects-grid" class="grid min-w-0 grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3"
            aria-live="polite">
            <p class="py-10 text-sm text-slate-500">Loading projects.</p>
        </div>
    </main>

    <div id="create-project-modal" role="dialog" aria-modal="true" aria-labelledby="create-project-title"
        class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <button id="create-project-backdrop" type="button" aria-label="Close create project dialog"
            class="absolute inset-0 cursor-default bg-slate-950/55"></button>
        <form id="create-project-form"
            class="relative z-10 flex max-h-[calc(100vh-2rem)] w-full max-w-lg flex-col overflow-hidden rounded-lg border border-slate-300 bg-white shadow-xl">
            <header class="flex items-start justify-between gap-4 border-b border-slate-300 px-5 py-4">
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase text-accent">New project</p>
                    <h2 id="create-project-title" class="mt-1 text-lg font-bold">Create a project</h2>
                </div>
                <button id="close-create-project" type="button" title="Close"
                    class="grid size-9 shrink-0 place-items-center rounded-lg text-slate-500 hover:bg-slate-100">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                    <span class="sr-only">Close</span>
                </button>
            </header>

            <div class="space-y-4 overflow-y-auto px-5 py-5">
                <div>
                    <label for="modal-project-name" class="text-sm font-semibold">Project Name <span class="text-red-700" aria-hidden="true">*</span></label>
                    <input id="modal-project-name" name="name" type="text" required maxlength="200"
                        autocomplete="off" placeholder="Household Ledger"
                        class="mt-1.5 w-full rounded-lg border-slate-300 text-sm focus:border-accent focus:ring-accent" />
                </div>
                <div>
                    <label for="modal-project-description" class="text-sm font-semibold">Description</label>
                    <textarea id="modal-project-description" name="description" rows="3" maxlength="4000"
                        placeholder="What this project is responsible for"
                        class="mt-1.5 w-full resize-y rounded-lg border-slate-300 text-sm focus:border-accent focus:ring-accent"></textarea>
                </div>
                <div>
                    <label for="modal-repository-path" class="text-sm font-semibold">Repository Path</label>
                    <input id="modal-repository-path" name="repository_path" type="text" autocomplete="off"
                        placeholder="/Users/name/projects/repository"
                        class="mt-1.5 w-full rounded-lg border-slate-300 font-mono text-sm focus:border-accent focus:ring-accent" />
                    <p class="mt-1.5 text-xs leading-5 text-slate-500">Optional local Git worktree.</p>
                </div>
                <p id="create-project-error" class="hidden rounded-lg border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-800"
                    role="alert"></p>
            </div>

            <footer class="flex justify-end gap-3 border-t border-slate-300 bg-slate-50 px-5 py-4">
                <button id="cancel-create-project" type="button"
                    class="min-h-10 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold hover:bg-slate-100">Cancel</button>
                <button id="btn-submit-project" type="submit"
                    class="min-h-10 rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800 disabled:cursor-wait disabled:opacity-60">Create project</button>
            </footer>
        </form>
    </div>

    <script src="/dashboard/app.js"></script>
</body>

</html>
