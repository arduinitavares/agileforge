<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#191c1e',
                        paper: '#f8fafc',
                        surface: '#ffffff',
                        border: '#e2e8f0',
                        accent: '#2563eb',
                        'accent-hover': '#1d4ed8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        };
    </script>
    <style>
        html { overflow-x: hidden; height: 100%; }
        body { min-width: 0; min-height: 100%; display: flex; flex-direction: column; }
        .material-symbols-outlined { font-size: 18px; line-height: 1; vertical-align: middle; }
        dialog::backdrop { background: rgb(15 23 42 / 0.55); backdrop-filter: blur(2px); }
    </style>
    <title>Projects | AgileForge</title>
</head>

<body class="bg-slate-50 font-sans text-ink antialiased">
    <div id="dashboard-content" class="flex flex-col min-h-screen">
        <!-- Top Control Bar -->
        <header class="sticky top-0 z-30 flex h-14 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 lg:px-8">
            <div class="flex min-w-0 items-center gap-3">
                <span class="grid size-8 shrink-0 place-items-center rounded-md bg-blue-600 text-white font-mono text-xs font-bold">AF</span>
                <div class="min-w-0">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-blue-600">AgileForge Command Center</p>
                    <h1 class="truncate text-sm font-bold text-slate-900">Projects Dashboard</h1>
                </div>
            </div>
            <button id="open-create-project" type="button"
                class="inline-flex h-8 items-center gap-1.5 rounded-md bg-blue-600 px-3 text-xs font-semibold text-white shadow-xs hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1 transition-colors">
                <span class="material-symbols-outlined text-[16px]" aria-hidden="true">add</span>
                <span>New Project</span>
            </button>
        </header>

        <!-- Main Workspace -->
        <main class="mx-auto w-full max-w-7xl px-4 py-6 lg:px-8 flex-1">
            <div class="mb-6 border-b border-slate-200 pb-4">
                <h2 class="text-lg font-bold text-slate-900">Project Workspaces</h2>
                <p class="mt-1 text-xs text-slate-600">Select a project to enter its Flight Deck lifecycle workspace.</p>
            </div>
            <div id="projects-grid" class="grid min-w-0 grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"
                aria-live="polite">
                <p class="py-10 text-xs text-slate-500 font-mono">Loading projects...</p>
            </div>
        </main>
    </div>

    <!-- Create Project Modal -->
    <div id="create-project-modal" role="dialog" aria-modal="true" aria-labelledby="create-project-title"
        aria-describedby="create-project-description"
        class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <button id="create-project-backdrop" type="button" aria-label="Close create project dialog"
            class="absolute inset-0 cursor-default bg-slate-950/50 backdrop-blur-xs"></button>
        <form id="create-project-form"
            class="relative z-10 flex max-h-[calc(100vh-2rem)] w-full max-w-lg flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
            <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 bg-slate-50/80">
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase text-blue-600">New Workspace</p>
                    <h2 id="create-project-title" class="mt-0.5 text-base font-bold text-slate-900">Create a Project</h2>
                    <p id="create-project-description" class="sr-only">Enter a name and optional project context.</p>
                </div>
                <button id="close-create-project" type="button" title="Close"
                    class="grid size-8 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-slate-200/60 hover:text-slate-700 transition-colors">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                    <span class="sr-only">Close</span>
                </button>
            </header>

            <div class="space-y-4 overflow-y-auto px-5 py-5 text-sm">
                <div>
                    <label for="modal-project-name" class="font-semibold text-slate-800">Project Name <span class="text-red-600" aria-hidden="true">*</span></label>
                    <input id="modal-project-name" name="name" type="text" required maxlength="200"
                        autocomplete="off" placeholder="e.g. String Calculator Lab"
                        class="mt-1.5 w-full rounded-md border-slate-300 text-sm focus:border-blue-600 focus:ring-blue-600" />
                </div>
                <div>
                    <label for="modal-project-description" class="font-semibold text-slate-800">Description</label>
                    <textarea id="modal-project-description" name="description" rows="3" maxlength="4000"
                        placeholder="What this product delivers and who it serves..."
                        class="mt-1.5 w-full resize-y rounded-md border-slate-300 text-sm focus:border-blue-600 focus:ring-blue-600"></textarea>
                </div>
                <div>
                    <label for="modal-repository-path" class="font-semibold text-slate-800">Repository Path</label>
                    <input id="modal-repository-path" name="repository_path" type="text" autocomplete="off"
                        placeholder="/Users/name/projects/repository"
                        class="mt-1.5 w-full rounded-md border-slate-300 font-mono text-sm focus:border-blue-600 focus:ring-blue-600" />
                    <p class="mt-1 text-xs text-slate-500">Optional local Git worktree path for TDD task execution.</p>
                </div>
                <p id="create-project-error" class="hidden rounded-md border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-800"
                    role="alert"></p>
            </div>

            <footer class="flex justify-end gap-2.5 border-t border-slate-200 bg-slate-50 px-5 py-3.5">
                <button id="cancel-create-project" type="button"
                    class="min-h-9 rounded-md border border-slate-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">Cancel</button>
                <button id="btn-submit-project" type="submit"
                    class="min-h-9 rounded-md bg-blue-600 px-4 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 disabled:cursor-wait disabled:opacity-60 transition-colors">Create project</button>
            </footer>
        </form>
    </div>

    <script src="/dashboard/app.js"></script>
</body>

</html>
