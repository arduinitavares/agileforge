<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#17202a',
                        paper: '#f7f8fa',
                        accent: '#087f5b',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        };
    </script>
    <title>Project Workflow | AgileForge</title>
</head>

<body class="min-h-screen bg-paper font-sans text-ink">
    <header class="border-b border-slate-300 bg-white">
        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex min-w-0 items-center gap-4">
                <a href="/dashboard" title="Back to projects"
                    class="grid size-9 shrink-0 place-items-center border border-slate-300 bg-white text-slate-700 hover:bg-slate-100">
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                    <span class="sr-only">Back to projects</span>
                </a>
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase text-accent">AgileForge</p>
                    <h1 id="project-page-title" class="truncate text-lg font-bold">Project workflow</h1>
                </div>
            </div>
            <button id="refresh-workflow-position" type="button" title="Refresh workflow position"
                class="grid size-9 shrink-0 place-items-center border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-50">
                <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                <span class="sr-only">Refresh workflow position</span>
            </button>
        </div>
    </header>

    <main>
        <section class="border-b border-slate-300 bg-white">
            <div id="project-summary" class="mx-auto grid max-w-7xl gap-5 px-4 py-6 sm:grid-cols-3 sm:px-6 lg:px-8">
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-500">Origin</p>
                    <p id="project-origin" class="mt-1 text-sm font-medium">Loading</p>
                </div>
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-500">Stories</p>
                    <p id="project-story-count" class="mt-1 text-sm font-medium">Loading</p>
                </div>
                <div>
                    <p class="text-xs font-semibold uppercase text-slate-500">Sprints</p>
                    <p id="project-sprint-count" class="mt-1 text-sm font-medium">Loading</p>
                </div>
            </div>
        </section>

        <section id="workflow-position-panel"
            class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8"
            aria-live="polite">
            <p class="text-sm text-slate-500">Loading workflow position.</p>
        </section>
    </main>

    <dialog id="workflow-action-dialog"
        class="w-[min(42rem,calc(100%-2rem))] border border-slate-300 bg-white p-0 shadow-xl backdrop:bg-slate-950/50">
        <form id="workflow-action-form" method="dialog">
            <header class="flex items-start justify-between gap-4 border-b border-slate-300 px-5 py-4">
                <div class="min-w-0">
                    <p class="text-xs font-semibold uppercase text-accent">Workflow action</p>
                    <h2 id="workflow-action-title" class="mt-1 break-words text-base font-bold"></h2>
                </div>
                <button id="workflow-action-cancel-icon" type="button" title="Cancel"
                    class="grid size-8 shrink-0 place-items-center text-slate-500 hover:bg-slate-100">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                    <span class="sr-only">Cancel</span>
                </button>
            </header>
            <div id="workflow-action-fields" class="max-h-[60vh] space-y-4 overflow-y-auto px-5 py-5"></div>
            <p id="workflow-action-error" class="hidden px-5 pb-4 text-sm text-red-700" role="alert"></p>
            <footer class="flex justify-end gap-3 border-t border-slate-300 bg-slate-50 px-5 py-4">
                <button id="workflow-action-cancel" type="button"
                    class="border border-slate-300 bg-white px-4 py-2 text-sm font-semibold hover:bg-slate-100">
                    Cancel
                </button>
                <button id="workflow-action-submit" type="submit"
                    class="bg-accent px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-800 disabled:opacity-50">
                    Execute
                </button>
            </footer>
        </form>
    </dialog>

    <script src="/dashboard/project.js"></script>
</body>

</html>
