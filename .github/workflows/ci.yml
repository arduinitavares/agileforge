name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    name: Linux container canonical gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Build pinned Linux test image
        run: uv run --no-project --python 3.13.15 python scripts/container.py build --target test --tag agileforge-test:ci
      - name: Copy the exact committed source into a named Linux workspace
        run: |
          docker volume create agileforge-ci-workspace
          docker volume create agileforge-ci-cache
          docker run --detach --name agileforge-ci-dev --platform linux/amd64 \
            --workdir /workspace \
            --mount type=volume,src=agileforge-ci-workspace,dst=/workspace \
            --mount type=volume,src=agileforge-ci-cache,dst=/cache \
            agileforge-test:ci
          uv run --no-project --python 3.13.15 python scripts/container.py --project-name agileforge-ci import-source
          docker exec -w /workspace/repos/agileforge agileforge-ci-dev uv sync --locked
      - name: Exercise launcher lifecycle in the Linux container
        run: >-
          uv run --no-project --python 3.13.15 python scripts/container.py
          --project-name agileforge-ci exec --
          uv run --locked python scripts/ci_launcher_smoke.py
          --profile ci-linux-${{ github.run_id }}-${{ github.run_attempt }}
          --expect-sha ${{ github.sha }}
      - name: Run the canonical gate through the host transport
        run: uv run --no-project --python 3.13.15 python scripts/container.py --project-name agileforge-ci exec -- ./agileforge-dev check
      - name: Build and rehearse the installed production image
        run: |
          uv run --no-project --python 3.13.15 python scripts/container.py build --target production --tag agileforge-production:ci
          uv run --no-project --python 3.13.15 python scripts/verify_container.py --image agileforge-production:ci --expect-sha "$GITHUB_SHA"
      - name: Verify normal Compose startup and persistent state
        run: uv run --no-project --python 3.13.15 python scripts/verify_compose.py --image agileforge-production:ci --expect-sha "$GITHUB_SHA"

  python-313:
    name: Python 3.13 full gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Install pyrepo-check controller
        run: |
          uv tool install --python 3.13.15 "git+https://github.com/arduinitavares/pyrepo-check.git@ac41bbe8e8588b8f4232979c47d26be37d78d413"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Verify lock
        run: uv lock --check
      - name: Install Playwright Chromium
        run: uv run --locked python -m playwright install --with-deps chromium
      - name: Run canonical full gate
        run: ./agileforge-dev check

  frontend:
    name: Node frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Run frontend suites
        run: >-
          node --test tests/test_workflow_position_display.mjs
          tests/test_lifecycle_workspace.mjs
          tests/test_sprint_retry_dashboard.mjs
          tests/test_dashboard_review_safety.mjs
          tests/test_cockpit_action_synchronization.mjs
          tests/test_create_project_modal_required_fields.mjs
          tests/test_vision_interview_ui.mjs
