name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-313:
    name: Python 3.13 full gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Install pyrepo-check controller
        run: |
          uv tool install --python 3.13.15 "git+https://github.com/arduinitavares/pyrepo-check.git@8651b8b377bb96f8cf9705a5bb76e6380a308007"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Verify lock
        run: uv lock --check
      - name: Install Playwright Chromium
        run: uv run --locked python -m playwright install --with-deps chromium
      - name: Run canonical full gate
        run: ./agileforge-dev check

  frontend:
    name: Node frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Run frontend suites
        run: >-
          node --test tests/test_workflow_position_display.mjs
          tests/test_sprint_retry_dashboard.mjs
          tests/test_create_project_modal_required_fields.mjs
          tests/test_vision_interview_ui.mjs

  macos-smoke:
    name: macOS launcher smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Exercise launcher lifecycle
        run: >-
          uv run --locked python scripts/ci_launcher_smoke.py
          --profile ci-macos-${{ github.run_id }}-${{ github.run_attempt }}
          --expect-sha ${{ github.sha }}

  windows-vision-evidence:
    name: Windows repository evidence security
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Run secure Windows evidence suites
        env:
          AGILEFORGE_REQUIRE_WINDOWS_SYMLINK_TESTS: "1"
        run: >-
          uv run --locked pytest
          tests/services/test_vision_evidence_reader.py
          tests/windows/test_vision_evidence_windows.py
          tests/services/test_vision_evidence.py
          tests/test_socket_marker_contract.py
          tests/windows/test_specification_source_windows.py
          tests/services/test_specification_source_registration.py
          tests/services/test_specification_source_application.py
          tests/adapters/test_vision_bootstrap_api.py
          tests/adapters/test_cli_workflow_domain.py -q
          --junitxml=windows-vision-evidence.xml
      - name: Require the real evidence security cases to execute
        shell: pwsh
        run: |
          [xml]$results = Get-Content -LiteralPath windows-vision-evidence.xml -Raw
          $requiredCases = @(
            'test_reader_factory_selects_posix_without_loading_windows'
            'test_reader_factory_selects_windows_lazily'
            'test_windows_reader_rejects_leaf_replacement_after_resolution'
            'test_windows_reader_retains_parent_or_blocks_intermediate_replacement'
            'test_windows_reader_detects_change_during_bounded_read'
            'test_windows_reader_detects_leaf_deletion_after_read'
            'test_windows_reader_bounds_materially_large_source'
            'test_windows_reader_omits_source_after_native_read_failure'
            'test_unreadable_and_escape_paths_warn_without_becoming_evidence'
            'test_stable_in_worktree_symlink_uses_the_approved_source_identity'
            'test_json_spec_symlink_rejects_approved_markdown_target'
            'test_lone_enable_socket_marker_fails_during_collection'
            'test_enable_socket_with_integration_marker_is_valid'
          )
          foreach ($name in $requiredCases) {
            $cases = @($results.SelectNodes('//testcase') | Where-Object {
              $_.name -eq $name
            })
            if ($cases.Count -ne 1 -or $cases[0].SelectSingleNode('skipped') -or $cases[0].SelectSingleNode('failure') -or $cases[0].SelectSingleNode('error')) {
              throw "The required evidence security case $name did not execute successfully exactly once."
            }
          }
          $paramCases = @($results.SelectNodes('//testcase') | Where-Object {
            $_.name.StartsWith('test_allowlisted_symlink_rejects_incompatible_or_unapproved_targets[')
          })
          if ($paramCases.Count -ne 4) {
            throw "Expected exactly 4 parameterized symlink cases, found $($paramCases.Count)."
          }
          foreach ($case in $paramCases) {
            if ($case.SelectSingleNode('skipped') -or $case.SelectSingleNode('failure') -or $case.SelectSingleNode('error')) {
              throw "Parameterized symlink case $($case.name) did not execute successfully."
            }
          }
      - name: Upload evidence results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-vision-evidence-results
          path: windows-vision-evidence.xml
          if-no-files-found: warn

  windows-ui-runtime:
    name: Windows UI runtime ownership
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Verify real Windows venv and run ownership regressions
        run: >-
          uv run --locked pytest tests/windows/test_dev_ui_runtime_windows.py
          tests/windows/test_distribution_runtime_windows.py
          tests/dev_runtime/test_dev_server.py
          tests/dev_runtime/test_dev_main.py
          tests/dev_runtime/test_cli_forwarding.py
          tests/dev_runtime/test_dev_secrets_file.py
          tests/windows/test_dev_secrets_windows.py
          tests/dev_runtime/test_profiles.py -q
          --junitxml=windows-ui-runtime.xml
      - name: Require the real regression to execute
        shell: pwsh
        run: |
          [xml]$results = Get-Content -LiteralPath windows-ui-runtime.xml -Raw
          $requiredCases = @(
            'test_real_windows_ui_owns_the_serving_interpreter'
            'test_real_windows_distribution_owns_the_installed_serving_interpreter'
            'test_real_windows_pre_identity_failure_cleans_acquired_child'
          )
          foreach ($name in $requiredCases) {
            $cases = @($results.SelectNodes('//testcase') | Where-Object {
              $_.name -eq $name
            })
            if ($cases.Count -ne 1 -or $cases[0].SelectSingleNode('skipped')) {
              throw "The real Windows ownership regression $name did not execute exactly once."
            }
          }
          $secretsCases = @($results.SelectNodes('//testcase') | Where-Object {
            $_.name -eq 'test_windows_secrets_regular_file_uses_native_handle'
          })
          if ($secretsCases.Count -ne 1 -or $secretsCases[0].SelectSingleNode('skipped')) {
            throw 'The real Windows secrets-file regression did not execute exactly once.'
          }
      - name: Upload UI runtime results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ui-runtime-results
          path: windows-ui-runtime.xml
          if-no-files-found: warn

  windows-full-gate:
    name: Windows Python 3.13 full gate
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.8"
          python-version: "3.13.15"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install Python 3.13.15
        run: uv python install 3.13.15
      - name: Install pyrepo-check controller
        shell: pwsh
        run: |
          uv tool install --python 3.13.15 "git+https://github.com/arduinitavares/pyrepo-check.git@8651b8b377bb96f8cf9705a5bb76e6380a308007"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv tool dir --bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify lock
        run: uv lock --check
      - name: Install Playwright Chromium
        run: uv run --locked python -m playwright install chromium
      - name: Run canonical full gate
        shell: pwsh
        env:
          AGILEFORGE_REQUIRE_WINDOWS_SYMLINK_TESTS: "1"
        run: |
          sh ./agileforge-dev check 2>&1 | Tee-Object -FilePath windows-canonical.log
          $gateExit = $LASTEXITCODE
          exit $gateExit
      - name: Upload canonical log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-canonical-output
          path: windows-canonical.log
          if-no-files-found: warn
