[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agileforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "GitPython==3.1.57",
    "google-adk==2.2.0",
    "icecream>=2.1.8",
    "ipykernel>=7.0.1",
    "litellm>=1.78.3",
    "markdown>=3.6",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.1",
    "pylint>=4.0.1",
    "pytest>=9.0.0",
    "pytest-socket==0.8.0",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.2",
    "rich>=14.2.0",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.37.0",
    "yfinance>=0.2.66",
    "ruff>=0.15.8",
]

[project.scripts]
agileforge = "cli.main:main"
agileforge-dev = "cli.dev_main:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["agile_sqlmodel", "api"]

[tool.setuptools.package-data]
"adapters.adk.prompts" = ["*.txt"]
config = ["*.yaml"]
frontend = ["*.html", "*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "adapters",
    "adapters.*",
    "cli",
    "config",
    "db",
    "frontend",
    "models",
    "repositories",
    "routers",
    "services",
    "services.*",
    "tools",
    "utils",
    "workflow",
    "workflow.*",
]
exclude = [
    "tests",
    "tests.*",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = [
    "integration: marks environment-dependent acceptance or external-provider tests",
]

[tool.coverage.run]
branch = true
source = [
    "cli",
    "db",
    "models",
    "repositories",
    "routers",
    "services",
    "tools",
    "utils",
    "workflow",
    "adapters",
]
omit = [
    "tests/*",
    "scripts/*",
    "notebooks/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "artifacts/coverage-html"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
force-exclude = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FIX",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TC",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "COM812",
    "ISC001",
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]
"agile_sqlmodel.py" = ["ANN202"]
"api.py" = ["BLE001", "TC002", "TC003"]
"notebooks/learning.ipynb" = ["ASYNC250", "BLE001", "EM101", "T201", "T203", "TRY003"]
"notebooks/testing_db.ipynb" = ["ANN001", "ANN201", "E501", "EM101", "S608", "T201", "TRY003"]
"repositories/__init__.py" = ["D104"]
"services/story_close_service.py" = ["I001"]
"repositories/story.py" = ["ANN204", "D100", "D107"]
"services/__init__.py" = ["D104"]
"services/packets/packet_service.py" = ["D103", "D107", "EM101", "TC003", "TRY003"]

[tool.bandit]
exclude_dirs = [".venv", "notebooks"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"
root = ["."]

[tool.ty.analysis]
allowed-unresolved-imports = []
replace-imports-with-any = []
respect-type-ignore-comments = false

[tool.ty.rules]
all = "error"
deprecated = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.src]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyrepo-check @ git+https://github.com/arduinitavares/pyrepo-check.git@8f88465e1ca88bf29b508f3c0f4eb96f4de31623",
    "pytest-cov>=7.0.0",
    "ty>=0.0.26",
]
